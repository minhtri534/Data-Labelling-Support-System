version: "3.9"

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: dlss-sqlserver-local
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD}
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q \"SELECT 1\" -C || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    volumes:
      - sqlserver_data:/var/opt/mssql

  migrate:
    image: mcr.microsoft.com/dotnet/sdk:9.0
    container_name: dlss-migrate-local
    working_dir: /src
    volumes:
      - ./:/src
    environment:
      ConnectionStrings__DefaultConnection: ${CONNECTIONSTRINGS__DEFAULTCONNECTION}
      ASPNETCORE_ENVIRONMENT: Development
    command: >
      bash -lc "dotnet tool install --global dotnet-ef --version 9.0.2; export PATH=\"$PATH:/root/.dotnet/tools\"; dotnet restore DataLabellingSupportSystem.Api.csproj; dotnet ef database update --project DataLabellingSupportSystem.Api.csproj"
    depends_on:
      sqlserver:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dlss-api-local
    ports:
      - "${API_PORT:-3000}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: ${CONNECTIONSTRINGS__DEFAULTCONNECTION}
      Jwt__SigningKey: ${JWT__SIGNINGKEY}
    depends_on:
      sqlserver:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  sqlserver_data:
